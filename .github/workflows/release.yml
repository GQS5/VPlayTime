name: Release

# Cut a release from the GitHub UI (tag vX.Y.Z). This workflow rebuilds
# from the tag, runs the full suite, and attaches the verified JAR.
# A failed build or test run stops the release — never publish by hand.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches project version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="$(grep -E '^version = ' build.gradle | sed -E 's/version = "(.*)"/\1/')"
          echo "tag=$TAG project=$VERSION"
          test "v$VERSION" = "$TAG"

      - name: Clean build with tests
        run: ./gradlew clean build --console=plain

      - name: Attach JAR to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/VPlaytime-*.jar
          fail_on_unmatched_files: true
