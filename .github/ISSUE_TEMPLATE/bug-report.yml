name: Bug report
description: Something broken in VPlayTime
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: VPlayTime version
      placeholder: 1.8.2
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server (Paper/Folia build) and Java version
      placeholder: Folia 1.21.11, Java 21
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Playtime provider
      options: [internal, placeholder]
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Paste the full VPlayTime lines (they carry file + key path). Redact player names/IPs if you like.
      render: shell
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config (rewards.yml / config.yml snippet)
      render: yaml
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
