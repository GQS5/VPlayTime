name: Feature request
description: Suggest an improvement for VPlayTime
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what hurts?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Config examples welcome.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: No reward amounts, slots, requirements, permissions or default commands change (or I explain why they must)
        - label: Works on both Paper and Folia
        - label: Works without PlaceholderAPI unless the feature is inherently about it
