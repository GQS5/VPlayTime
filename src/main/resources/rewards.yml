# ============================================================
# VPlaytime - Menus & Rewards
# by VackStudio
# ============================================================
#
# Shipped default: 60 playtime levels across 4 menus
# (Levels 1-15: 1h+ ... Levels 46-60: up to 560h).
# Open them with /vplaytime, /vplaytime menu_2, and so on.
#
# This is the main content file. It holds everything players see:
#
#   Menu   = one inventory screen (for example "main").
#   Reward = one item inside that screen (for example "reward_1").
#
# After editing, run:  /vplaytime reload
# If the reload reports an error, your OLD menus stay active,
# so you can fix the file without breaking anything.
#
# ------------------------------------------------------------
# HOW TO ADD A REWARD
# ------------------------------------------------------------
#
# 1. Copy an existing reward (reward_1 is a good template).
# 2. Give the copy a new ID, for example reward_4.
# 3. Change required-seconds (time is measured in seconds).
# 4. Choose a free slot in the same menu.
# 5. Change the name, lore and materials.
# 6. Change the actions (what the player receives).
# 7. Save the file.
# 8. Run:  /vplaytime reload
#
# Example:
#
#   reward_4:
#     slot: 16
#     required-seconds: 14400
#     ...
#
# ------------------------------------------------------------
# HOW TO ADD A MENU
# ------------------------------------------------------------
#
# 1. Copy an existing menu (copy from "main:" down to its last line).
# 2. Give the copy a new menu ID, for example menu_2.
#    The ID is used in commands:  /vplaytime menu_2
# 3. Change "name" (the human-readable label).
# 4. Set the next free "order" number (1, 2, 3, ...).
# 5. Change title, rows and sounds if you like.
# 6. Add the rewards you want (copy reward blocks).
# 7. Save the file.
# 8. Run:  /vplaytime reload
#
# There is no fixed limit to the number of menus.
# Menus are ordered by "order": order 1 is page 1, order 2
# is page 2, and so on. Removing a menu never forces you to
# renumber the rest.
#
# ------------------------------------------------------------
# REWARD ACTIONS
# ------------------------------------------------------------
#
# A reward can contain multiple actions. Each action is one
# thing the player receives when claiming that reward.
#
# Example:
#
# actions:
#   - type: item
#     material: DIAMOND
#     amount: 10
#
#   - type: item
#     material: GOLD_INGOT
#     amount: 20
#
# You can add as many actions as your reward needs
# (up to 64 per reward). They run in the order you list them:
# items arrive together in one delivery, commands run
# afterwards on the console in order.
#
#   type: item       Give the player an item.
#   material:        Minecraft item type, for example DIAMOND.
#   amount:          How many items to give (1 to 64).
#
#   type: command    Run a console command.
#   command:         The command. %player% becomes the player name.
#
# ------------------------------------------------------------
# MENU BUTTONS (optional)
# ------------------------------------------------------------
#
# A menu can also hold buttons: things players click that are
# NOT rewards. Buttons never give anything and never track claims.
#
# To add a button that opens another menu:
#
#     items:
#       next_page:
#         slot: 26
#         material: ARROW
#         name: "<green>Next Page"
#         lore:
#           - "<gray>Open the second menu"
#         action:
#           open-menu: menu_2
#
# To add a button that closes the menu:
#
#     items:
#       close_button:
#         slot: 22
#         material: BARRIER
#         name: "<red>Close"
#         action:
#           close: true
#
# To send the player a message (menu stays open unless you also close):
#
#     items:
#       store:
#         slot: 16
#         material: EMERALD
#         name: "<green>Store"
#         action:
#           message: "<gray>Shop at <white>https://example.com"
#           close: true
#
# A button with NO action is pure display (for example a live
# stats readout — %playtime% and friends work in button text):
#
#     items:
#       stats:
#         slot: 25
#         material: CLOCK
#         name: "<white>Your Stats"
#         lore:
#           - "<gray>Playtime: <white>%playtime%"
#
# Background filler for the empty slots of one menu:
#
#     fill:
#       material: GREEN_STAINED_GLASS_PANE
#       name: "<white> "
#       lore: []
#
# Rules: button IDs use lowercase letters, numbers and underscores
# (for example 'next_page', never 'next-page'). Every button needs
# its own slot, shared with no reward and no other button. The
# 'open-menu' target must be a menu ID from this file.
#
# ------------------------------------------------------------
# DISPLAY: WRITE THE LORE ONCE
# ------------------------------------------------------------
#
# 'name' and 'lore' directly under 'display:' are shared by all
# three looks (locked, claimable, claimed). You only set the
# material per look (plus 'glow: true' where you want shine):
#
# display:
#   name: "<white>30 Minute Reward"
#   lore:
#     - "<gray>Requires <white>%required_playtime%</white>"
#   locked:
#     material: RED_STAINED_GLASS_PANE
#   claimable:
#     material: GRAY_STAINED_GLASS_PANE
#     glow: true
#   claimed:
#     material: LIME_STAINED_GLASS_PANE
#
# A single look can still set its own 'lore:' to override
# the shared one (even an empty list).
#
# ------------------------------------------------------------
# COLORS: LEGACY AND MINIMESSAGE
# ------------------------------------------------------------
#
# Both color systems work everywhere (names, lore, titles,
# messages), even mixed in one line:
#
#   name: "&d&l1 Hour Reward"          legacy (&0-9, &a-f, &k-o, &r)
#   name: "<green><bold>Reward</green>"  MiniMessage
#   name: "<gradient:#55ffff:#aa00ff>Reward</gradient>"
#
# ------------------------------------------------------------
# TIME: USE 1h INSTEAD OF SECONDS
# ------------------------------------------------------------
#
#   time: 30s     30 seconds
#   time: 10m     10 minutes
#   time: 1h      1 hour
#   time: 2d      2 days
#   time: 1w      1 week
#
# The old 'required-seconds: 3600' still works. If a reward has
# both, 'time:' wins.
#
# ------------------------------------------------------------
# SHORT ACTIONS
# ------------------------------------------------------------
#
#   actions:
#     - command: "addmoney %player% 1000"
#     - item: "DIAMOND 10"
#
# The long form ('- type: item' with material/amount) still works.
# Order is kept exactly as listed.
#
# ------------------------------------------------------------
# SHORT BUTTON ACTIONS
# ------------------------------------------------------------
#
#   action: next-page        open the next menu in order
#   action: previous-page    open the previous menu in order
#   action: close            close the menu
#   action: open-menu: menu_2
#
# ------------------------------------------------------------
# PLAYER HEADS
# ------------------------------------------------------------
#
#   material: PLAYER_HEAD
#   head: "%player%"       the viewing player's head
#   head: "Notch"          a named player's head
#   head:
#     texture: "BASE64..." texture value
#
# ------------------------------------------------------------
# SHARED DEFAULTS (less repetition)
# ------------------------------------------------------------
#
#   defaults:
#     reward:
#       display:
#         locked:
#           material: MAGENTA_CANDLE
#         claimable:
#           material: MAGENTA_CANDLE
#           glow: true
#         claimed:
#           material: MAGENTA_CANDLE
#
# Anything a reward sets itself always wins. A menu can also have
# its own 'defaults:' block, which beats the file-level one.
#
# ------------------------------------------------------------
# SOUNDS: ANY MINECRAFT SOUND
# ------------------------------------------------------------
#
# VPlaytime supports Minecraft registered sound keys. You do not
# need to maintain a list of supported sounds.
#
# Simple form (all of these mean the same sound):
#
#     sounds:
#       open: BLOCK_CHEST_OPEN
#       open: "minecraft:block.chest.open"
#       open: "BLOCK_CHEST_OPEN"
#
# Advanced form with volume (0 or higher) and pitch (above 0
# up to 2, default 1.0 for both):
#
#     sounds:
#       claim:
#         sound: "entity.player.levelup"
#         volume: 1.0
#         pitch: 1.2
#
# Each menu owns four events: open, claim, locked, already-claimed.
# Unknown sounds warn once in the console (naming the menu) and
# stay silent in game. Empty ("") means silence.
#
# ------------------------------------------------------------
# COMMON MISTAKES (the reload will reject these safely)
# ------------------------------------------------------------
#
# - Menu IDs must be unique.
# - Every menu needs its own "order" number.
# - Reward IDs must be unique inside the same menu.
# - Slots must be different inside the same menu.
# - Slots must fit inside the row count (see the diagram below).
# - 'open-menu:' needs a menu id (an empty value is rejected).
# - Time is measured in seconds, not minutes.
# - YAML indentation matters: use spaces, never tabs.
#
# ------------------------------------------------------------
# MENU ID vs NAME vs TITLE
# ------------------------------------------------------------
#
#   ID     long_playtime          used in the file and in commands
#   name   <aqua>Long Playtime    human-readable label
#   title  <dark_gray>...         the inventory window title
#
# The ID never shows in game. The title is what players see
# at the top of the open inventory.

