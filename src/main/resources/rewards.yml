# ============================================================
# VPlaytime - Rewards & Menus
# ============================================================
#
# 3 pages x 5 levels (1-15). Each level: slot, time, look, actions.
#
# time:   30s / 10m / 1h / 2d / 1w  (playtime needed to unlock)
# actions run in order when claimed. In commands you can use:
#   %player% %uuid% %claim_id%
#
# Menu lore/names understand:
#   %playtime% %playtime_seconds% %playtime_minutes% %playtime_hours%
#   %required_playtime% %reward_status%
#
# To add a level: copy a block, new id (level_16...), free slot,
# bigger time. To add a page: copy a menu, new id, next order number.
#
# Player/admin texts live in messages.yml.
# After editing, run:  /vplaytime reload
# ============================================================

